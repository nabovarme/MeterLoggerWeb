<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.5, shrink-to-fit=no">
	<title>MeterLogger Firmware Flash Tool</title>

	<link rel="stylesheet" href="/css/menu.css" />
	<script src="/js/menu.js.epl" defer></script>
	<link rel="stylesheet" href="default.css">

	<script type="module">
		import { ESPLoader, Transport } from 'https://unpkg.com/esptool-js/bundle.js';
		window.ESPLoader = ESPLoader;
		window.Transport = Transport;
	</script>

	<style>
		/* Global layout and defaults */
		html, body {
			height: 100%;
			margin: 0;
			padding: 0;
			font-family: Verdana, Geneva, sans-serif;
			font-size: 100%;
			overflow-x: hidden; /* Prevent horizontal scroll */
		}

		/* --- TYPOGRAPHY TOKENS --- */
		.default {
			font-family: Verdana, Geneva, sans-serif;
			font-size: 100%;
		}
		.default-bold {
			font-family: Verdana, Geneva, sans-serif;
			font-weight: bold;
		}
		.default-small {
			font-family: Verdana, Geneva, sans-serif;
			font-size: 60%;
		}
		.default-group {
			font-family: Verdana, Geneva, sans-serif;
			font-weight: bold;
			font-size: 120%;
		}

		.nowrap {
			white-space: nowrap;
		}

		/* High-performance hiding utility that bypasses layout recalculation */
		.hidden {
			display: none !important;
		}
		
		/* Applied to log console for fluid rendering under intensive web-serial streams */
		#log {
			-webkit-overflow-scrolling: touch; 
			will-change: scroll-position;
			transform: translateZ(0); /* Isolates fixed bar into its own GPU layer */
			
			margin: 10px;
			padding: 10px;
			font-family: monospace;
			font-size: 12px;
			background: #f4f4f4;
			border: 1px solid #ccc;
			max-height: 250px;
			width: calc(100% - 20px);
			box-sizing: border-box;
			overflow-y: auto;
			white-space: pre-wrap;
		}

		/* VIRTUALIZATION: Tells Safari to drop the console element context if hidden */
		#log.hidden {
			content-visibility: auto;
			contain-intrinsic-size: 250px;
		}
		
		/* --- COMPONENT STYLES --- */
		.action-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 10px 5px 10px; box-sizing: border-box; }
		.options-row { display: flex; align-items: center; gap: 25px; width: 100%; padding: 5px 10px 10px 10px; box-sizing: border-box; }
		
		.search-container { flex-grow: 1; max-width: 600px; display: flex; flex-direction: column; }
		.search-container input[type="search"] { width: 100%; padding: 8px; font-family: Verdana, Geneva, sans-serif; font-size: 100%; box-sizing: border-box; }
		
		.flash-btn-inline { padding: 8px 20px; font-family: Verdana, Geneva, sans-serif; font-size: 100%; cursor: pointer; white-space: nowrap; align-self: flex-end; }
		
		.progress-container { padding: 0 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
		progress { width: 100%; height: 20px; }

		.config-options { display: none; }
		
		.console-toggle { display: inline-flex; align-items: center; cursor: pointer; user-select: none; margin: 0 10px 10px 10px; }
		.triangle { display: inline-block; transition: transform 0.2s ease; margin-right: 5px; font-size: 12px; }
		.triangle.open { transform: rotate(90deg); }
		
		.control-group { display: flex; align-items: center; gap: 8px; }
		.control-group select { padding: 6px; font-family: Verdana, Geneva, sans-serif; font-size: 90%; }
		.control-group input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; margin: 0; }
	</style>
</head>

<body>
	<div class="header default-group" style="padding: 10px 10px 0 10px;">MeterLogger Firmware Flash Tool</div>

	<div class="action-row">
		<div class="search-container">
			<label for="searchField" class="default-bold" style="margin-bottom: 5px;">Select firmware profile:</label>
			<input type="search" id="searchField" list="firmwareOptions" placeholder="Click or type to search firmware..." autocomplete="off" disabled>
			<datalist id="firmwareOptions"></datalist>
		</div>
		
		<button id="flashBtn" class="flash-btn-inline">Flash Device</button>

		<div class="config-options">
			<select id="flashMode"><option value="dout" selected>dout</option><option value="dio">dio</option></select>
			<select id="flashSize"><option value="1MB" selected>1MB</option><option value="2MB">2MB</option><option value="4MB">4MB</option></select>
		</div>
	</div>

	<div class="options-row">
		<div class="control-group">
			<label for="baudRate" class="default-bold" style="font-size: 90%;">Baud Rate:</label>
			<select id="baudRate">
				<option value="115200" selected>115200</option>
				<option value="230400">230400</option>
				<option value="460800">460800</option>
				<option value="921600">921600</option>
				<option value="1500000">1500000</option>
			</select>
		</div>

		<div class="control-group">
			<input type="checkbox" id="eraseFlash">
			<label for="eraseFlash" class="default-bold" style="font-size: 90%; cursor: pointer; user-select: none;">Erase Flash</label>
		</div>
	</div>

	<div class="options-row" style="flex-direction: column; align-items: flex-start; background: #f9f9f9; border: 1px solid #ddd; border-radius: 4px; margin: 10px; padding: 15px; box-sizing: border-box; width: calc(100% - 20px);">
		<div class="default-bold" style="font-size: 100%; margin-bottom: 12px; color: #2b7a70;">Dynamic Firmware Compiler Workspace</div>
		
		<div style="display: flex; flex-direction: column; gap: 12px; width: 100%; margin-bottom: 15px;">
			<div>
				<div class="default-bold" style="font-size: 85%; color: #666; margin-bottom: 5px; border-bottom: 1px solid #eee; padding-bottom: 2px;">1. Meter Protocol & Hardware Type</div>
				<div style="display: flex; flex-wrap: wrap; gap: 15px;">
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="radio" name="meterProtocol" value="KMP" checked> Kamstrup KMP (Multical 601)
					</label>
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="radio" name="meterProtocol" value="MC_66C"> Multical 66 C (EN61107)
					</label>
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="radio" name="meterProtocol" value="MC_66B"> Multical 66 B (EN61107)
					</label>
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="radio" name="meterProtocol" value="IMPULSE"> Impulse-Based Meter
					</label>
				</div>
			</div>

			<div>
				<div class="default-bold" style="font-size: 85%; color: #666; margin-bottom: 5px; border-bottom: 1px solid #eee; padding-bottom: 2px;">2. Valve & Functional Overrides</div>
				<div style="display: flex; flex-wrap: wrap; gap: 15px;">
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="checkbox" id="flagFlowMeter" value="FLOW_METER"> Force Flow Meter Mode
					</label>
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="checkbox" id="flagAutoClose" value="NO_AUTO_CLOSE"> Disable Auto-Close Engine
					</label>
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="checkbox" id="flagNoCron" value="NO_CRON"> Disable Cron (Saves 2.6KB RAM)
					</label>
				</div>
			</div>

			<div>
				<div class="default-bold" style="font-size: 85%; color: #666; margin-bottom: 5px; border-bottom: 1px solid #eee; padding-bottom: 2px;">3. Actuator & AC Electrical Profiles</div>
				<div style="display: flex; flex-wrap: wrap; gap: 15px;">
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="checkbox" id="flagThermoNO" value="THERMO_NO"> Actuator is Normally Open (Default NC)
					</label>
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="checkbox" id="flagThermoAC2" value="THERMO_ON_AC_2"> Actuator Connected on AC 2
					</label>
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="checkbox" id="flagLedAc" value="LED_ON_AC"> Use LED to Indicate AC State
					</label>
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="checkbox" id="flagAcTest" value="AC_TEST"> Run AC Test Loop Pattern
					</label>
				</div>
			</div>

			<div>
				<div class="default-bold" style="font-size: 85%; color: #666; margin-bottom: 5px; border-bottom: 1px solid #eee; padding-bottom: 2px;">4. Telemetry Debugging & Simulation</div>
				<div style="display: flex; flex-wrap: wrap; gap: 15px;">
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="checkbox" id="flagSerialDebug" value="DEBUG"> Enable Serial Output Debugging
					</label>
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="checkbox" id="flagNoMeter" value="NO_METER"> Emulation Mode (DEBUG_NO_METER)
					</label>
					<label class="default" style="font-size: 85%; display: flex; align-items: center; gap: 4px; cursor: pointer;">
						<input type="checkbox" id="flagStackTrace" value="DEBUG_STACK_TRACE"> Capture Flash Stack Traces
					</label>
				</div>
			</div>
		</div>
		
		<button id="rebuildBtn" class="flash-btn-inline" style="background-color: #2b7a70; color: white; border: none; border-radius: 4px; padding: 8px 16px; font-size: 90%; cursor: pointer; align-self: flex-start;">Compile & Rebuild Profile</button>
	</div>

	<div id="progressWrapper" class="progress-container hidden">
		<progress id="flashProgress" value="0" max="100"></progress>
	</div>

	<div>
		<span id="toggleLogBtn" class="default default-bold console-toggle">
			<span id="triangleIcon" class="triangle">&#9658;</span> <span id="logTitleText">Log</span>
		</span>
		
		<div id="log" class="hidden">Status: Waiting for interaction...</div>
	</div>

	<script>
		const searchInput = document.getElementById('searchField');
		const flashBtn = document.getElementById('flashBtn');
		const logDiv = document.getElementById('log');
		const toggleLogBtn = document.getElementById('toggleLogBtn');
		const logTitleText = document.getElementById('logTitleText');
		const triangleIcon = document.getElementById('triangleIcon');
		const flashMode = document.getElementById('flashMode');
		const flashSize = document.getElementById('flashSize');
		const progressWrapper = document.getElementById('progressWrapper');
		const flashProgress = document.getElementById('flashProgress');
		const baudRateSelect = document.getElementById('baudRate');
		const eraseFlashCheckbox = document.getElementById('eraseFlash');
		const rebuildBtn = document.getElementById('rebuildBtn');

		let allFirmwares = [];
		let selectedFirmware = null;
		let transport = null;

		function log(msg) {
			logDiv.textContent += "\n" + msg;
			logDiv.scrollTop = logDiv.scrollHeight;
			console.log(msg);
		}

		function setLogVisibility(visible) {
			if (visible) {
				logDiv.classList.remove('hidden');
				triangleIcon.classList.add('open');
				logDiv.scrollTop = logDiv.scrollHeight;
			} else {
				logDiv.classList.add('hidden');
				triangleIcon.classList.remove('open');
			}
		}

		toggleLogBtn.addEventListener('click', () => {
			const isVisible = !logDiv.classList.contains('hidden');
			setLogVisibility(!isVisible);
		});

		function loadFirmwareList() {
			fetch('firmware/firmwares.json')
				.then(res => res.json())
				.then(list => {
					allFirmwares = list.sort((a, b) => a.name.localeCompare(b.name));
					searchInput.disabled = false;
					
					// Clear any outdated properties inside the old options tree first
					const optionsContainer = document.getElementById('firmwareOptions');
					optionsContainer.innerHTML = '';

					allFirmwares.forEach(fw => {
						const opt = document.createElement('option');
						opt.value = fw.name;
						optionsContainer.appendChild(opt);
					});
				});
		}

		// Initial pull sequence on execution setup
		loadFirmwareList();

		searchInput.addEventListener('input', () => {
			selectedFirmware = allFirmwares.find(fw => fw.name === searchInput.value) || null;
		});

		// =========================================================================
		// REMOTE COMPILER ACTION HANDLER
		// =========================================================================
		rebuildBtn.addEventListener('click', async () => {
			if (!selectedFirmware) { 
				alert("Please pick an existing firmware option path context from the search list profile options first!"); 
				return; 
			}

			// Capture selected modifier array strings
			const modifiers = [];

			// 1. Evaluate Protocol Selection Radio Group
			const selectedProtocol = document.querySelector('input[name="meterProtocol"]:checked').value;
			if (selectedProtocol !== 'KMP') {
				modifiers.push(selectedProtocol);
			}

			// 2. Evaluate remaining checkboxes variables
			if (document.getElementById('flagFlowMeter').checked)   modifiers.push('FLOW_METER');
			if (document.getElementById('flagAutoClose').checked)   modifiers.push('NO_AUTO_CLOSE');
			if (document.getElementById('flagNoCron').checked)      modifiers.push('NO_CRON');
			if (document.getElementById('flagThermoNO').checked)    modifiers.push('THERMO_NO');
			if (document.getElementById('flagThermoAC2').checked)   modifiers.push('THERMO_ON_AC_2');
			if (document.getElementById('flagLedAc').checked)       modifiers.push('LED_ON_AC');
			if (document.getElementById('flagAcTest').checked)      modifiers.push('AC_TEST');
			if (document.getElementById('flagSerialDebug').checked)  modifiers.push('DEBUG');
			if (document.getElementById('flagNoMeter').checked)     modifiers.push('NO_METER');
			if (document.getElementById('flagStackTrace').checked)  modifiers.push('DEBUG_STACK_TRACE');

			const swVersionSuffix = modifiers.length > 0 ? modifiers.join('_') : 'STANDARD';

			try {
				rebuildBtn.disabled = true;
				setLogVisibility(true);
				
				logTitleText.textContent = "Log (Compiling)";
				log(`[Compiler] Issuing compile instructions payload configuration targeting Serial: ${selectedFirmware.serial}...`);

				const targetApiUri = '/api/rebuild';
				const response = await fetch(targetApiUri, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						serial: selectedFirmware.serial,
						sw_version_modifiers: swVersionSuffix
					})
				});

				const outcome = await response.json();
				if (!response.ok || !outcome.success) {
					throw new Error(outcome.error || `Server returned invalid compilation status execution state: ${response.status}`);
				}

				log(`[Compiler Success] Remote background job successfully generated and dispatched! Batch context assigned: ${outcome.batch_id}`);
				log(`[Compiler Info] Give the compiler pipeline roughly ~45-90 seconds to bundle the specialized image asset stack context.`);
				log(`[Compiler Info] You can reload or search again shortly to locate and download the finalized custom firmware structure!`);
				
				alert("Custom compilation has successfully queued up on the remote cluster nodes!");
				
				// Re-fetch index automatically after a short delay block interval to pull newly discovered images
				setTimeout(loadFirmwareList, 15000);
			} catch (err) {
				log(`[Compiler Error Failed] Build creation process failed: ${err.message}`);
				alert(`Failed to trigger customized compilation stack: ${err.message}`);
			} finally {
				rebuildBtn.disabled = false;
			}
		});

		// =========================================================================
		// NATIVE WEBSERIAL HARDWARE FLASH HANDLER
		// =========================================================================
		flashBtn.addEventListener('click', async () => {
			if (!selectedFirmware) { alert("Please select a firmware first!"); return; }

			try {
				flashBtn.disabled = true;
				progressWrapper.classList.remove('hidden');
				flashProgress.value = 0;

				logTitleText.textContent = "Log";
				logDiv.textContent = "Fetching manifest details...";
				
				const manifestResponse = await fetch('firmware/' + selectedFirmware.path);
				if (!manifestResponse.ok) {
					throw new Error(`Failed to download manifest (${manifestResponse.status}).`);
				}
				const manifest = await manifestResponse.json();
				
				if (!manifest.builds || manifest.builds.length === 0 || !manifest.builds[0].parts) {
					throw new Error("Invalid manifest layout format detected.");
				}
				
				const baseDir = selectedFirmware.path.substring(0, selectedFirmware.path.lastIndexOf('/') + 1);
				const manifestParts = manifest.builds[0].parts;
				const fileArray = [];

				for (const chunk of manifestParts) {
					const binUrl = 'firmware/' + baseDir + chunk.path;
					const segmentOffset = chunk.offset;

					log(`Fetching segment component from: ${binUrl}`);
					const chunkResponse = await fetch(binUrl);
					if (!chunkResponse.ok) {
						throw new Error(`Failed to download component asset (${chunkResponse.status}): ${chunk.path}`);
					}
					
					const chunkBuffer = await chunkResponse.arrayBuffer();
					log(`Buffered component [${chunk.path}] successfully (${chunkBuffer.byteLength} bytes) designated for 0x${segmentOffset.toString(16)}`);

					fileArray.push({
						data: new Uint8Array(chunkBuffer),
						address: segmentOffset
					});
				}

				const chosenBaud = parseInt(baudRateSelect.value, 10);
				const shouldErase = eraseFlashCheckbox.checked;

				const port = await navigator.serial.requestPort({});
				transport = new Transport(port, true);
				
				const esploader = new ESPLoader({
					transport: transport,
					baudrate: chosenBaud,
					romBaudrate: 115200,
					debugLogging: false, 
					terminal: { 
						clean: () => { logDiv.textContent = ""; }, 
						writeLine: (d) => log(d), 
						write: (d) => log(d)
					}
				});
				
				log("Connecting to hardware bootloader...");
				await esploader.main();

				const chosenMode = flashMode.value.toLowerCase();
				const chosenSize = flashSize.value.toUpperCase();

				// Calculate the combined size of all uncompressed bin chunks
				const totalBatchBytes = fileArray.reduce((acc, file) => acc + file.data.byteLength, 0);
				
				let currentFileIndex = -1;
				let completedBytesOffset = 0;

				log(`Flashing ${fileArray.length} distinct binary segments into memory spaces...`);
				await esploader.writeFlash({
					fileArray: fileArray,
					flashMode: chosenMode,
					flashSize: chosenSize, 
					flashFreq: "keep", 
					eraseAll: shouldErase,
					compress: true,
					reportProgress: (fileIndex, written, total) => {
						if (fileIndex !== currentFileIndex) {
							if (currentFileIndex >= 0) {
								completedBytesOffset += fileArray[currentFileIndex].data.byteLength;
							}
							currentFileIndex = fileIndex;
						}

						const currentFileTotal = fileArray[fileIndex].data.byteLength;
						const currentProgressFraction = total > 0 ? (written / total) : 0;
						
						const scaledCurrentWritten = currentProgressFraction * currentFileTotal;
						const totalBytesProcessed = completedBytesOffset + scaledCurrentWritten;
						
						const pct = Math.min(100, Math.round((totalBytesProcessed / totalBatchBytes) * 100));
						
						flashProgress.value = pct;
						log(`Total Progress: ${pct}% (Segment ${fileIndex + 1}/${fileArray.length})`);
					}
				});
				
				log("Success! Flash complete.");
				await esploader.after("hard_reset");
				logTitleText.textContent = "Log (Flash completed)";
			} catch (e) {
				log("Error: " + e.message);
				console.error(e);
				alert("Flashing error: " + e.message);
			} finally {
				flashBtn.disabled = false;
				progressWrapper.classList.add('hidden');
				
				if (transport) {
					log("Disconnecting from serial port...");
					try {
						await transport.disconnect();
					} catch (err) {
						console.error("Error while closing WebSerial transport wrapper:", err);
					}
					transport = null;
				}
			}
		});
	</script>
</body>
</html>
