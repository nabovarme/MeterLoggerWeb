<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MeterLogger - Push Notifications</title>
	<link rel="stylesheet" href="/css/menu.css">
	<script src="/js/menu.js.epl" defer></script>
	<style>
		:root {
			--primary-color: #1a73e8;
			--success-color: #2e7d32;
			--error-color: #c5221f;
			--bg-color: #f8f9fa;
			--card-bg: #ffffff;
			--border-color: #dadce0;
			--text-color: #3c4043;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background-color: var(--bg-color);
			color: var(--text-color);
			margin: 0;
			padding: 40px 20px;
			display: flex;
			justify-content: center;
			align-items: flex-start;
			min-height: 80vh;
		}

		.subscribe-card {
			background: var(--card-bg);
			border: 1px solid var(--border-color);
			border-radius: 8px;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
			padding: 32px;
			max-width: 440px;
			width: 100%;
			box-sizing: border-box;
		}

		.subscribe-card h2 {
			margin-top: 0;
			margin-bottom: 8px;
			font-size: 1.4rem;
		}

		.subscribe-card p {
			color: #5f6368;
			font-size: 0.95rem;
			line-height: 1.5;
			margin-bottom: 24px;
		}

		.form-group {
			margin-bottom: 20px;
		}

		.form-group label {
			display: block;
			font-weight: 600;
			font-size: 0.85rem;
			margin-bottom: 6px;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}

		.form-group input {
			width: 100%;
			padding: 10px 12px;
			border: 1px solid var(--border-color);
			border-radius: 4px;
			font-size: 1rem;
			box-sizing: border-box;
		}

		.btn-submit {
			width: 100%;
			background-color: var(--primary-color);
			color: #ffffff;
			border: none;
			padding: 12px;
			font-size: 1rem;
			font-weight: 600;
			border-radius: 4px;
			cursor: pointer;
			transition: background-color 0.2s ease;
		}

		.btn-submit:hover {
			background-color: #1557b0;
		}

		.btn-submit:disabled {
			background-color: #9aa0a6;
			cursor: not-allowed;
		}

		.status-message {
			margin-top: 16px;
			font-size: 0.9rem;
			text-align: center;
			font-weight: 500;
			display: none;
		}

		.status-message.active {
			display: block;
		}
	</style>
</head>
<body>

	<div class="subscribe-card">
		<h2>Web Push Notifications</h2>
		<p>Subscribe this browser to receive real-time telemetry warnings, valve state alerts, and status notifications.</p>

		<form id="push-form" onsubmit="handleSubscribe(event)">
			<div class="form-group">
				<label for="meter-serial">Meter Serial Number</label>
				<input type="text" id="meter-serial" placeholder="e.g. 0906863" required autocomplete="off">
			</div>

			<button type="submit" id="btn-subscribe" class="btn-submit">
				Enable Notifications
			</button>
		</form>

		<div id="status-message" class="status-message"></div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const urlParams = new URLSearchParams(window.location.search);
			const serialParam = urlParams.get('serial');
			if (serialParam) {
				document.getElementById('meter-serial').value = serialParam;
			}
			checkPermission();
		});

		function urlBase64ToUint8Array(base64String) {
			if (!base64String || typeof base64String !== 'string') {
				throw new Error('Invalid or missing VAPID public key string.');
			}
			const padding = '='.repeat((4 - base64String.length % 4) % 4);
			const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
			const rawData = window.atob(base64);
			const outputArray = new Uint8Array(rawData.length);
			for (let i = 0; i < rawData.length; ++i) {
				outputArray[i] = rawData.charCodeAt(i);
			}
			return outputArray;
		}

		// Cross-browser safe ArrayBuffer to Base64URL encoder
		function arrayBufferToBase64Url(buffer) {
			if (!buffer) return '';
			let binary = '';
			const bytes = new Uint8Array(buffer);
			const len = bytes.byteLength;
			for (let i = 0; i < len; i++) {
				binary += String.fromCharCode(bytes[i]);
			}
			return window.btoa(binary)
				.replace(/\+/g, '-')
				.replace(/\//g, '_')
				.replace(/=+$/, '');
		}

		function checkPermission() {
			const btn = document.getElementById('btn-subscribe');
			if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
				btn.disabled = true;
				showStatus('Web Push is unsupported in this browser.', '#c5221f');
				return;
			}

			if (Notification.permission === 'granted') {
				btn.innerText = 'Update Subscription';
			} else if (Notification.permission === 'denied') {
				btn.disabled = true;
				showStatus('Notifications blocked in browser settings.', '#c5221f');
			}
		}

		function showStatus(text, color) {
			const status = document.getElementById('status-message');
			status.innerText = text;
			status.style.color = color;
			status.classList.add('active');
		}

		async function handleSubscribe(event) {
			event.preventDefault();

			const btn = document.getElementById('btn-subscribe');
			const serialInput = document.getElementById('meter-serial').value.trim();

			if (!serialInput) {
				showStatus('Please enter a valid meter serial.', '#c5221f');
				return;
			}

			btn.disabled = true;
			btn.innerText = 'Subscribing...';
			showStatus('Requesting permissions...', '#555');

			try {
				// 1. Fetch server VAPID key
				const vapidRes = await fetch('/api/vapid_key');
				if (!vapidRes.ok) throw new Error('Failed to retrieve VAPID key configuration.');
				const vapidData = await vapidRes.json();

				const vapidPublicKey = vapidData.public_key || vapidData.publicKey;
				if (!vapidPublicKey) {
					throw new Error(vapidData.error || 'Server returned empty VAPID public key.');
				}

				// 2. Register Service Worker with root scope
				const registration = await navigator.serviceWorker.register('/js/service-worker.js', { scope: '/' });
				await navigator.serviceWorker.ready;

				// 3. Request browser notification permission
				const permission = await Notification.requestPermission();
				if (permission !== 'granted') throw new Error('Notification permission denied by user.');

				// 4. Clean up any existing subscription
				let subscription = await registration.pushManager.getSubscription();
				if (subscription) {
					await subscription.unsubscribe();
				}

				// 5. Create fresh subscription using VAPID key
				const convertedKey = urlBase64ToUint8Array(vapidPublicKey);
				subscription = await registration.pushManager.subscribe({
					userVisibleOnly: true,
					applicationServerKey: convertedKey
				});

				// 6. Extract JSON & keys reliably
				const subJson = subscription.toJSON();
				let p256dhKey = (subJson.keys && subJson.keys.p256dh) ? subJson.keys.p256dh : '';
				let authKey   = (subJson.keys && subJson.keys.auth)   ? subJson.keys.auth   : '';

				// Fallback to direct ArrayBuffer extraction if toJSON() omitted keys
				if (!p256dhKey) {
					p256dhKey = arrayBufferToBase64Url(subscription.getKey('p256dh'));
				}
				if (!authKey) {
					authKey = arrayBufferToBase64Url(subscription.getKey('auth'));
				}

				if (!p256dhKey || !authKey) {
					throw new Error('Browser failed to generate push encryption keys.');
				}

				// 7. Post subscription payload to backend
				const response = await fetch('/api/subscribe_push', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						serial: serialInput,
						endpoint: subscription.endpoint,
						p256dh: p256dhKey,
						auth: authKey
					})
				});

				const result = await response.json();
				if (result.success === 1) {
					btn.disabled = false;
					btn.innerText = 'Update Subscription';
					btn.style.backgroundColor = 'var(--success-color)';
					showStatus(`Successfully subscribed meter ${serialInput}!`, 'var(--success-color)');
				} else {
					throw new Error(result.error || 'Server rejected subscription payload.');
				}

			} catch (err) {
				btn.disabled = false;
				btn.innerText = Notification.permission === 'granted' ? 'Update Subscription' : 'Enable Notifications';
				showStatus(err.message || 'Subscription failed.', 'var(--error-color)');
			}
		}
	</script>
</body>
</html>
